name: Keep API awake

# Render's free plan sleeps a service after 15 minutes without traffic, and the next
# visitor waits 30-60s for it to wake. Pinging the health check every 10 minutes keeps
# it warm. GitHub may start scheduled runs a few minutes late, so this is best effort.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://readmanix.vercel.app/api/health
